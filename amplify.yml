version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd fedex-ai-poc/frontend
        - nvm install 24
        - nvm use 24
        - node --version
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: fedex-ai-poc/frontend/.next
    files:
      - '**/*'
  cache:
    paths:
      - fedex-ai-poc/frontend/node_modules/**/*
