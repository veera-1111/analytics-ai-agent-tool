name: Terraform — Plan / Apply

on:
  push:
    branches: [main]
    paths:
      - 'fedex-ai-poc/infrastructure/terraform/**'
  pull_request:
    paths:
      - 'fedex-ai-poc/infrastructure/terraform/**'

env:
  TF_WORKING_DIR: fedex-ai-poc/infrastructure/terraform

jobs:
  terraform:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.5"

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_amplify_github_token: ${{ secrets.TF_VAR_AMPLIFY_GITHUB_TOKEN }}
          TF_VAR_credentials_encryption_key: ${{ secrets.TF_VAR_CREDENTIALS_ENCRYPTION_KEY }}
        run: terraform plan -no-color 2>&1 | tee plan_output.txt
        continue-on-error: true

      - name: Post plan as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.TF_WORKING_DIR }}/plan_output.txt', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## Terraform Plan\n```\n' + plan.slice(-60000) + '\n```'
            });

      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_amplify_github_token: ${{ secrets.TF_VAR_AMPLIFY_GITHUB_TOKEN }}
          TF_VAR_credentials_encryption_key: ${{ secrets.TF_VAR_CREDENTIALS_ENCRYPTION_KEY }}
        run: terraform apply -auto-approve
